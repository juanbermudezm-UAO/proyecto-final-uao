global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: backends
    metrics_path: /metrics
    static_configs:
      - targets: ["backend1:5000", "backend2:5000", "backend3:5000"]

  - job_name: nginx-exporter
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]