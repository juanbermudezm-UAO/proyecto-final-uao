global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:

  # Prometheus se monitorea a si mismo.
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  # Tres instancias Python.
  - job_name: backends
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend-1:8000
          - backend-2:8000
          - backend-3:8000

  # Exportador de Nginx.
  - job_name: nginx
    metrics_path: /metrics
    static_configs:
      - targets:
          - nginx-exporter:9113

  # Metricas de recursos por contenedor.
  - job_name: cadvisor
    metrics_path: /metrics
    static_configs:
      - targets:
          - cadvisor:8080

  # Metricas complementarias de Docker Desktop.
  - job_name: docker-stats
    metrics_path: /metrics
    static_configs:
      - targets:
          - docker-stats-exporter:9274
