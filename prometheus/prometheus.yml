# ==========================================
# Proyecto final
# Configuracion de Prometheus
# ==========================================

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Monitoreo del propio Prometheus
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  # Tres instancias de backend Python
  - job_name: backends
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend-1:8000
          - backend-2:8000
          - backend-3:8000

  # Exportador Nginx (stub_status)
  - job_name: nginx-exporter
    static_configs:
      - targets:
          - nginx-exporter:9113

  # Recursos por contenedor (cAdvisor)
  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  # Metricas de red y disco (Docker API)
  - job_name: docker-stats
    metrics_path: /metrics
    static_configs:
      - targets:
          - docker-stats-exporter:9274
