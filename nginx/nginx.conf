worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Formato de log con la instancia que atendio y el tiempo de respuesta
    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent '
                    'upstream=$upstream_addr instance=$upstream_http_x_instance_id '
                    'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Grupo de backends (round-robin por defecto)
    upstream backend_pool {
        # Memoria compartida: todos los workers comparten el turno de
        # round-robin y el estado de fallos (max_fails / fail_timeout)
        zone backend_pool 64k;

        server backend1:5000 max_fails=3 fail_timeout=10s;
        server backend2:5000 max_fails=3 fail_timeout=10s;
        server backend3:5000 max_fails=3 fail_timeout=10s;
    }

    # Servidor publico: proxy inverso hacia los backends
    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://backend_pool;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Si un backend falla, reintentar en otro
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 2s;
            proxy_read_timeout    10s;

            # Mostrar al cliente que backend atendio
            add_header X-Upstream-Addr $upstream_addr always;
        }

        # /metrics de los backends no debe ser publico
        location = /metrics {
            return 404;
        }
    }

    # Servidor interno solo para el exportador (puerto 8888, no publicado al host)
    server {
        listen 8888;
        server_name _;

        location /stub_status {
            stub_status;
            access_log off;
            allow all;
        }
    }
}