worker_processes auto;

error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format backend_log
        '$remote_addr - [$time_local] '
        '"$request" $status '
        'upstream=$upstream_addr '
        'response_time=$request_time';

    access_log /dev/stdout backend_log;

    sendfile on;
    keepalive_timeout 30;

    upstream python_backends {
        zone python_backends 64k;

        resolver 127.0.0.11 valid=5s ipv6=off;

        server backend-1:8000 resolve
            max_fails=1 fail_timeout=5s;

        server backend-2:8000 resolve
            max_fails=1 fail_timeout=5s;

        server backend-3:8000 resolve
            max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://python_backends;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 2s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;

            add_header X-Upstream-Addr $upstream_addr always;
        }
    }

    server {
        listen 8081;
        server_name _;

        location = /stub_status {
            stub_status;
            access_log off;
        }

        location / {
            return 404;
        }
    }
}
